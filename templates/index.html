<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion AI Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Emotion Timeline</span>
      <span class="sidebar-sub">This session</span>
    </div>

    <div class="chart-wrap">
      <canvas id="emotionChart"></canvas>
      <div id="chart-empty" class="chart-empty">Start chatting to see your emotion trend</div>
    </div>

    <div class="emotion-legend">
      <div class="legend-label">Emotions</div>
      <div class="legend-item"><span class="dot" style="background:#e8944a"></span> Happy</div>
      <div class="legend-item"><span class="dot" style="background:#e8607a"></span> Love</div>
      <div class="legend-item"><span class="dot" style="background:#5b90cc"></span> Sad</div>
      <div class="legend-item"><span class="dot" style="background:#9b72cf"></span> Stressed</div>
      <div class="legend-item"><span class="dot" style="background:#d95555"></span> Angry</div>
      <div class="legend-item"><span class="dot" style="background:#f0b429"></span> Surprised</div>
      <div class="legend-item"><span class="dot" style="background:#8a9a88"></span> Neutral</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-messages">0</div>
        <div class="stat-label">Messages</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-dominant">—</div>
        <div class="stat-label">Top mood</div>
      </div>
    </div>
  </aside>

  <!-- Loading/cold-start banner -->
  <div id="loading-banner" style="
    display:none; position:fixed; top:0; left:0; right:0; z-index:9999;
    background:#c4703a; color:#fff; padding:12px 20px;
    font-size:14px; font-weight:600; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);">
  </div>

  <main class="chat-panel">

    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"/>
            <path d="M9 11V7a3 3 0 0 1 6 0v4"/>
            <circle cx="9" cy="16" r="1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="16" r="1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div>
          <h2>Emotion AI</h2>
          <p class="status-line"><span class="status-dot"></span> Online &amp; ready</p>
        </div>
      </div>
      <button class="clear-btn" onclick="clearChat()" title="Clear chat">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button>
    </div>

    <div id="chatbox" class="chatbox">
      <div class="welcome-msg">
        <div class="welcome-icon">👋</div>
        <p>Hi! I'm your Emotion AI assistant. Tell me how you're feeling and I'll do my best to understand and support you.</p>
      </div>
    </div>

    <div id="typing" class="typing-indicator" style="display:none">
      <span></span><span></span><span></span>
    </div>

    <div class="input-area">
      <input id="message" type="text" placeholder="Tell me how you feel…" autocomplete="off" maxlength="500">
      <button id="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/script.js"></script>
</body>
</html>
