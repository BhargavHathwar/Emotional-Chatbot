[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python -c \"import nltk, os; dl=os.path.expanduser('~/nltk_data'); os.makedirs(dl, exist_ok=True); [nltk.download(p, download_dir=dl) for p in ('stopwords','wordnet','omw-1.4')]; print('NLTK data downloaded to', dl)\"",
  "python -c \"import pickle, os; print('PKL files present:', [f for f in os.listdir('.') if f.endswith('.pkl')])\""
]

[start]
cmd = "gunicorn app:app --timeout 120 --workers 1 --bind 0.0.0.0:$PORT"
