[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = [
  "python -c \"import nltk; nltk.download('stopwords'); nltk.download('wordnet'); nltk.download('omw-1.4'); print('NLTK data downloaded')\"",
  "python -c \"import pickle, os; print('PKL files present:', [f for f in os.listdir('.') if f.endswith('.pkl')])\"" 
]

[start]
cmd = "gunicorn app:app --timeout 120 --workers 1 --bind 0.0.0.0:$PORT"
